{% extends "base.html" %}
{% set editing = product is not none %}
{% block title %}{{ 'Edit' if editing else 'Tambah' }} Produk · Admin · SQLi Research Lab{% endblock %}
{% block content %}
<h1>{{ 'Edit produk' if editing else 'Tambah produk' }}</h1>
<section class="card">
  <form method="post"
        action="{{ url_for('admin.product_edit', product_id=product.id) if editing else url_for('admin.product_create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Nama</label>
    <input id="name" name="name" type="text" value="{{ form.get('name', '') }}" required maxlength="120">
    <label for="category">Kategori</label>
    <input id="category" name="category" type="text" value="{{ form.get('category', '') }}" required maxlength="50">
    <label for="description">Deskripsi</label>
    <textarea id="description" name="description" rows="4">{{ form.get('description', '') }}</textarea>
    <label for="price">Harga (Rp)</label>
    <input id="price" name="price" type="number" min="0" step="0.01" value="{{ form.get('price', '') }}" required>
    <label for="stock">Stok</label>
    <input id="stock" name="stock" type="number" min="0" step="1" value="{{ form.get('stock', '') }}" required>
    <button type="submit" class="btn">Simpan</button>
    <a href="{{ url_for('admin.products') }}" class="muted">Batal</a>
  </form>
</section>
{% endblock %}
